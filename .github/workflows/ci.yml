name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - name: Deploy database migrations for E2E
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://inventory:change_me@localhost:5432/inventory_test?schema=public
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://inventory:change_me@localhost:5432/inventory_test?schema=public
          JWT_SECRET: ci_secret_value
          JWT_EXPIRES_IN: 15m
          CORS_ORIGIN: http://localhost:5173
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build frontend Docker image
        run: docker build --build-arg VITE_API_URL= -t inventory-frontend:ci .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t inventory-backend:ci ./backend
