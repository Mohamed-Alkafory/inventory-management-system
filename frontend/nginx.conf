server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS. Resolve the backend at request time so Nginx can
    # start before/without the backend and pick up a restarted container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:3000;

    # Container health probe (never touches the backend).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend REST API. The backend already serves under /api/v1, so the
    # original path is forwarded unchanged.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded product images and avatars are served by the backend outside
    # the /api/v1 prefix.
    location /uploads/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed files under /assets, safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so new asset hashes are picked up.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: deep links (/admin/orders, /login, ...) must reach React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}